# Publica josepalacios.site: build de Next (output: export) -> GitHub Pages.
#
# Sustituye a la publicacion legacy desde la raiz de main, que servia el sitio
# estatico antiguo. La fuente de Pages hay que cambiarla a "GitHub Actions" en
# los ajustes del repo; con "Deploy from a branch" este workflow no publica nada.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que esta en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `build` encadena `next build` y scripts/postbuild.mjs, que es quien
      # comprueba CNAME/.nojekyll y reescribe el sitemap con las URLs .html.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
